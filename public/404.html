<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>APML Portal</title>
    <script>
      (function () {
        // GitHub Pages hosts this repository under /APML-Portal/.
        // Vercel and Cloudflare Pages host it at the domain root.
        var repoBase = '/APML-Portal/';
        var base = window.location.pathname.indexOf(repoBase) === 0 ? repoBase : '/';
        var path = base === repoBase
          ? window.location.pathname.slice(repoBase.length)
          : window.location.pathname.replace(/^\/+/, '');
        var requested = path + window.location.search + window.location.hash;
        window.location.replace(base + '?p=' + encodeURIComponent(requested));
      })();
    </script>
  </head>
  <body>Opening APML Portal…</body>
</html>
