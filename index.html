<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function(){
        var theme = "light";
        try {
          var saved = localStorage.getItem("apml-theme");
          if (saved === "dark" || saved === "light") theme = saved;
        } catch (error) {}
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf7f3" />
    <meta name="description" content="APML Portal — a practical workspace for quotations, directories, rates and operations." />
    <title>APML Portal — Employee Workspace</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%logo.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="APML Portal" />
    <link rel="apple-touch-icon" href="%BASE_URL%pwa-192.svg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body><script>
    (function(){
      var p=new URLSearchParams(window.location.search).get('p');
      if(p!==null){
        var base='%BASE_URL%';
        window.history.replaceState(null,'',base+p.replace(/^\/+/, ''));
      }
    })();
  </script><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
