    <script>
      (function(){
        var theme = "light";
        try {
          var saved = localStorage.getItem("apml-theme");
          if (saved === "dark" || saved === "light") theme = saved;
        } catch (error) {}
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
